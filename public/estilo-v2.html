*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Nunito','Quicksand','Trebuchet MS',system-ui,sans-serif;
  background:#E8EDF4;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}

/* ---------- presentación de la página (mínima) ---------- */
.stage{max-width:1180px;margin:0 auto;padding:44px 24px 72px}
.stage-hd{margin-bottom:34px;text-align:center}
.stage-hd h1{font-size:21px;font-weight:900;letter-spacing:-.02em}
.stage-hd h1 em{font-style:normal;color:var(--violet)}
.stage-hd p{font-size:12.5px;color:#7A87A8;font-weight:600;margin-top:5px}
.phones{display:flex;gap:44px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.unit{display:flex;flex-direction:column;align-items:center;gap:16px}
.unit figcaption{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.unit figcaption b{font-size:13px;font-weight:800}
.unit figcaption span{font-size:11px;color:#8B96B4;font-weight:600;max-width:300px}
.reset-link{font-size:11px;color:var(--violet);font-weight:800;cursor:pointer;margin-top:5px;
  background:none;border:none;font-family:inherit;text-decoration:underline dotted}

/* ---------- el teléfono ---------- */
.phone{
  width:390px;height:844px;border-radius:54px;background:#0F1526;padding:11px;
  box-shadow:0 34px 70px rgba(15,21,38,.28);
  flex:none;
}
.screen{
  width:100%;height:100%;border-radius:43px;overflow:hidden;position:relative;
  background-image:var(--fondo);background-size:cover;background-position:center;
}
.scrolly{height:100%;overflow-y:auto;scrollbar-width:none;position:relative;z-index:2;
  padding:0 0 114px}
.scrolly::-webkit-scrollbar{display:none}

/* status bar */
.statusbar{
  position:sticky;top:0;z-index:5;
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 26px 2px;color:#fff;
}
.sb-time{font-size:15px;font-weight:800;letter-spacing:.02em}
.sb-icons{display:flex;gap:6px;align-items:center}
.sb-icons svg{display:block}

/* ---------- header identidad + nivel (corregido a la ref) ---------- */
.hdr{
  position:sticky;top:0;z-index:4;
  display:flex;align-items:center;gap:9px;
  padding:6px 15px 8px 14px;
}
.catwrap{position:relative;flex:none}
.catAv{width:56px;height:56px;border-radius:50%;background-image:var(--av);
  background-size:100%;background-position:center;
  box-shadow:0 6px 16px rgba(23,32,102,.30)}
.dot{position:absolute;right:-1px;bottom:1px;width:12px;height:12px;border-radius:50%;
  background:var(--green);border:2.5px solid #fff}
.hdr-id{flex:1;min-width:0}
.hdr-id h2{color:#fff;font-size:21px;font-weight:900;letter-spacing:-.01em;line-height:1.02;
  display:flex;align-items:center;gap:5px}
.hdr-id p{color:rgba(255,255,255,.95);font-size:9.2px;font-weight:700;margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:4px}
.sp4{fill:#fff;flex:none}
.sp4.lg{width:14px;height:14px;margin-top:1px}
.sp4.sm{width:7.5px;height:7.5px;opacity:.92}
/* nivel: pill + barra + texto flotando apilados (sin contenedor) */
.lvl{flex:none;width:118px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.lvl-pill{display:inline-flex;align-items:center;gap:5px;
  background:linear-gradient(180deg,#7C5FF9,#6D52F8);
  border-radius:11px;padding:4px 10px 4px 9px;
  box-shadow:0 4px 12px rgba(84,52,190,.36)}
.lvl-pill svg{flex:none}
.lvl-pill span{color:#fff;font-size:11.5px;font-weight:800;letter-spacing:.01em}
.xpbar{width:100%;height:6px;border-radius:3px;background:rgba(255,255,255,.34);overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.30)}
.xpbar i{display:block;height:100%;border-radius:3px;width:64%;
  background:linear-gradient(180deg,#F6D868,#FDC533);
  transition:width .6s cubic-bezier(.22,1,.36,1)}
.xptxt{color:#fff;font-size:8.5px;font-weight:800;letter-spacing:.03em;
  text-shadow:0 1px 4px rgba(10,40,100,.4)}
.mbtn{
  flex:none;width:33px;height:33px;border-radius:50%;cursor:pointer;
  background:linear-gradient(180deg,#45A2FF,#2C8DF6);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 9px rgba(3,62,150,.30);
}

/* chat */
.chat{display:flex;flex-direction:column;gap:7px;padding:2px 14px 4px}
.row{display:flex;align-items:flex-end;gap:8px}
.row.user{justify-content:flex-end}
.row.koru{justify-content:flex-start}
.bub-koru-av{width:34px;height:34px;border-radius:50%;background-image:var(--av);
  background-size:100%;background-position:center;
  flex:none;margin-bottom:6px;box-shadow:0 3px 8px rgba(23,32,102,.22)}
.bub{
  position:relative;max-width:74%;background:var(--card);border-radius:var(--r-bub);
  padding:8px 13px 9px;font-size:13px;font-weight:600;line-height:1.42;color:var(--ink);
  box-shadow:var(--sh-bub);
}
.bub b{font-weight:800}
.bub-user{border-bottom-right-radius:6px}
.bub-koru{border-bottom-left-radius:6px}
.bub-user::after,.bub-koru::after{
  content:'';position:absolute;bottom:0;width:14px;height:14px;background:var(--card);
}
.bub-user::after{right:-5px;border-radius:0 4px 12px 12px;clip-path:polygon(0 0,100% 100%,0 100%)}
.bub-koru::after{left:-5px;border-radius:4px 0 12px 12px;clip-path:polygon(100% 0,100% 100%,0 100%)}
.meta{display:flex;align-items:center;gap:5px;margin:0 4px 2px}
.row.user .meta{justify-content:flex-end}
.meta .t{color:rgba(255,255,255,.9);font-size:9.5px;font-weight:800}
.meta .chk2{color:#fff;font-size:10px;font-weight:900}
.uAv{width:25px;height:25px;border-radius:50%;flex:none;
  background:var(--uav) center/100% no-repeat;
  margin-bottom:2px;box-shadow:0 0 0 1.5px #fff,0 2px 6px rgba(23,32,102,.22)}
.bub .sig{display:inline-flex;vertical-align:-2px;margin-left:5px}
.bub .sig svg{width:11px;height:11px;fill:var(--violet)}

/* ---------- CARD ILUSTRADA (el mini-mundo) ---------- */
.icard{
  position:relative;width:274px;margin:3px auto 8px;flex:none;
  background:#fff;border-radius:22px;padding:3.5px;
  box-shadow:var(--sh-card);
}
.ihero{
  position:relative;height:132px;border-radius:18px 18px 12px 12px;overflow:hidden;
  background-image:var(--h);background-size:cover;background-position:center 64%;
}
.ihero::before{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(13,44,110,.30) 0%,rgba(13,44,110,.04) 38%,
  rgba(13,44,110,0) 55%,rgba(13,44,110,.30) 100%)}
.locpill{
  position:absolute;top:9px;left:9px;z-index:2;
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(33,48,185,.78);
  color:#fff;border-radius:9px;padding:4px 10px 4px 8px;
  font-size:10.5px;font-weight:800;letter-spacing:.01em;
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  box-shadow:0 4px 10px rgba(13,30,110,.28);max-width:calc(100% - 18px);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.locpill svg{flex:none}
.locpill > span{font-size:12.5px;line-height:1;flex:none}
.chip2{
  position:absolute;top:9px;right:9px;z-index:2;
  display:inline-flex;align-items:center;gap:4px;
  background:rgba(255,77,84,.94);color:#fff;border-radius:9px;padding:4px 8px;
  font-size:9px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;
  box-shadow:0 4px 10px rgba(200,30,50,.30);
}
.chip2::before{content:'';width:5.5px;height:5.5px;border-radius:50%;background:#fff;
  animation:pulse 1.2s infinite}
.chip2.flat::before{display:none}
.chip2.up{background:rgba(47,200,110,.94);box-shadow:0 4px 10px rgba(20,140,70,.3)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.hero-data{position:absolute;left:13px;top:28px;z-index:2}
.sun3d{position:absolute;right:18px;top:14px;z-index:2;filter:drop-shadow(0 5px 9px rgba(170,110,0,.38))}
.hd-col{min-width:0}
.bigval{display:block;font-size:38px;font-weight:900;line-height:1.02;letter-spacing:-.025em;color:#fff;
  text-shadow:0 3px 10px rgba(10,42,104,.5)}
.bigsub{display:block;font-size:13.5px;font-weight:800;color:#fff;margin-top:4px;letter-spacing:-.01em;
  text-shadow:0 2px 7px rgba(10,42,104,.55)}
.bigmin{display:block;font-size:10px;font-weight:700;color:rgba(255,255,255,.97);margin-top:2px;
  text-shadow:0 1px 5px rgba(10,42,104,.6)}
.bigval.up{color:#A6FFCB;text-shadow:0 3px 10px rgba(7,80,40,.55)}
.bigval.md{font-size:29px}
.bigsub.up{color:#A6FFCB}
/* panel blanco inferior (solapa la ilustración) */
.ipanel{position:relative;z-index:3;margin:-14px 3px 0;border-radius:15px;background:#fff;
  padding:8px 6px 6px;box-shadow:0 6px 16px rgba(23,32,102,.12)}
.tiles{display:flex;gap:7px}
.tile{flex:1;min-width:0;background:#F3F6FD;border-radius:11px;padding:6px 3px 6px;text-align:center}
.tile .e{display:block;font-size:17px;line-height:1.1}
.tile .e svg{display:block;margin:0 auto}
.tile .k{display:block;font-size:8.5px;color:#7982B4;font-weight:800;letter-spacing:.02em;
  margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{display:block;font-size:10.5px;font-weight:900;color:var(--navy);margin-top:1px;
  letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cta{
  position:relative;overflow:hidden;width:100%;margin-top:8px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;
  background:linear-gradient(180deg,#7A5DF9,#5B41EE);color:#fff;border:none;
  border-radius:16px;font-family:inherit;font-size:11.5px;font-weight:800;letter-spacing:-.005em;
  padding:8px 6px 9px;box-shadow:0 7px 15px rgba(91,65,238,.36);
  transition:transform .12s;
}
.cta::before{content:'';position:absolute;top:0;left:10%;right:10%;height:46%;
  background:linear-gradient(180deg,rgba(255,255,255,.30),rgba(255,255,255,0));
  border-radius:0 0 60% 60%;pointer-events:none}
.cta:active{transform:translateY(1px)}
.cta svg{flex:none}
.cta.ok{background:linear-gradient(180deg,#3BD67F,#23B363);box-shadow:0 7px 15px rgba(35,179,99,.34)}
/* radar hora a hora (expandible) */
.radar{max-height:0;overflow:hidden;transition:max-height .5s cubic-bezier(.22,1,.36,1)}
.radar.open{max-height:120px}
.radar-in{display:flex;gap:3px;padding:8px 1px 1px}
.rr{flex:1;text-align:center;min-width:0}
.rr b{display:block;font-size:8px;color:#8A93C2;font-weight:800;letter-spacing:.04em;
  text-transform:uppercase}
.rr .re{display:block;font-size:15px;margin:3px 0 1px;line-height:1}
.rr i{display:block;font-style:normal;font-size:10.5px;font-weight:900;color:var(--navy)}

/* mini barras (informe) */
.bars2{display:flex;gap:5px;height:34px;margin:8px 2px 1px;align-items:flex-end}
.bars2 div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:3px}
.bars2 i{display:block;width:100%;border-radius:3px;background:var(--peri)}
.bars2 div.hi i{background:var(--gold)}
.bars2 .d{display:block;font-size:7.5px;color:var(--ink-faint);font-weight:800;text-align:center}

/* ---------- card misión (blanca, interactiva) ---------- */
.card{
  background:var(--card);border-radius:var(--r-card);padding:13px 16px 14px;
  box-shadow:var(--sh-card);border:none;
}
.card + .card{margin-top:12px}
.card-hd{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.card-hd h3{font-size:14.5px;font-weight:800;letter-spacing:-.01em;flex:1;min-width:0;color:var(--violet-deep)}
.card-hd .sub{font-size:11px;color:var(--ink-soft);font-weight:700}
.chip{
  display:inline-flex;align-items:center;gap:4px;background:#EFEBFD;color:#6443F0;
  font-size:9.5px;font-weight:800;letter-spacing:.04em;padding:4px 9px 5px;border-radius:9px;
  text-transform:uppercase;flex:none;
}
.chip.gold{background:var(--gold);color:#5A4200}
.chip.green{background:var(--green-soft);color:#0E9E4C}
.mList{list-style:none}
.mList li{
  display:flex;align-items:center;gap:11px;padding:7px 2px;
  border-bottom:1px solid var(--line);cursor:pointer;position:relative;
}
.mList li:last-child{border-bottom:none}
.mList li:active{background:#FAFCFF}
.chk{
  flex:none;width:24px;height:24px;border-radius:50%;border:2px solid #C9D2EE;background:#fff;
  cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;
  transition:transform .15s;
}
.chk:active{transform:scale(.88)}
.mList li.done .chk{background:var(--green);border-color:var(--green)}
.chk svg{opacity:0;transform:scale(.4);transition:all .25s cubic-bezier(.34,1.56,.64,1)}
.mList li.done .chk svg{opacity:1;transform:scale(1)}
.mi-emoji{flex:none;font-size:19px;width:24px;text-align:center;line-height:1}
.mi-txt{flex:1;min-width:0;font-size:13.5px;font-weight:700;line-height:1.3}
.xpchip{
  flex:none;display:inline-flex;align-items:center;gap:3px;background:var(--gold);color:#5A4200;
  font-size:9.5px;font-weight:900;padding:4px 8px;border-radius:8px;letter-spacing:.02em;
  opacity:0;transform:translateX(6px) scale(.7);transition:all .3s cubic-bezier(.34,1.56,.64,1);
}
.mList li.done .xpchip{opacity:1;transform:none}
.chev{flex:none;color:#B9C0DE;margin-left:2px}
.mList li.done .chev{display:none}
.banner{
  margin-top:9px;background:linear-gradient(180deg,#F2EEFE,#EAE4FC);border-radius:14px;padding:8px 12px 9px;
  display:flex;align-items:center;gap:10px;
}
.banner .bulb{flex:none;font-size:19px;line-height:1}
.banner .btxt{flex:1;min-width:0}
.banner .btxt b{display:block;font-size:12px;font-weight:800;color:var(--violet)}
.banner .btxt span{display:block;font-size:10.5px;color:var(--ink-soft);font-weight:700;margin-top:1px}
.banner .spark{flex:none;font-size:14px}

/* ---------- pills rápidas + composer ---------- */
.dockwrap{position:absolute;left:12px;right:12px;bottom:13px;z-index:6;
  display:flex;flex-direction:column;gap:8px}
.dockwrap::before{content:'';position:absolute;left:-10px;right:-10px;bottom:-13px;height:calc(100% + 40px);
  background:linear-gradient(180deg,rgba(232,240,252,0) 0%,rgba(232,240,252,.5) 42%,rgba(232,240,252,.82) 100%);
  border-radius:28px 28px 26px 26px;pointer-events:none;z-index:-1}
.qpills{display:flex;gap:6px;justify-content:center;align-items:center}
.qpills::before,.qpills::after{
  content:'✦';color:var(--gold);font-size:10px;font-weight:900;line-height:1;
  text-shadow:0 2px 5px rgba(120,80,0,.3);flex:none;
}
.qpill{
  height:31px;border-radius:16px;padding:0 12px;border:none;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;letter-spacing:-.005em;
  color:#3D2E96;background:rgba(255,255,255,.95);
  box-shadow:0 4px 12px rgba(23,32,102,.16);
}
.qpill svg{flex:none}
.qpill.on{
  background:linear-gradient(180deg,#6D5BF9,#4A41EE);color:#fff;
  box-shadow:0 6px 14px rgba(74,65,238,.44);
}
.dock{
  background:#fff;border-radius:25px;padding:7px;
  display:flex;align-items:center;gap:7px;box-shadow:var(--sh-dock);
}
.dbtn{
  flex:none;width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;
  background:var(--violet);display:flex;align-items:center;justify-content:center;
  box-shadow:var(--sh-btn);
}
.dbtn:active{transform:scale(.93);background:var(--violet-deep)}
.dfield{flex:1;height:40px;background:#EFF4FD;border-radius:20px;display:flex;align-items:center;
  padding:0 14px;color:#9AA6C8;font-size:12.5px;font-weight:700}
.homebar{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);
  width:118px;height:4px;border-radius:2px;background:rgba(255,255,255,.7);z-index:7}

/* ---------- toast ---------- */
.toast{
  position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) scale(.55);z-index:20;
  background:#fff;border-radius:26px;padding:26px 34px 22px;text-align:center;
  box-shadow:0 30px 70px rgba(23,32,102,.35);opacity:0;pointer-events:none;
  transition:all .45s cubic-bezier(.34,1.56,.64,1);width:262px;
}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast .em{font-size:44px;line-height:1;display:block;margin-bottom:8px}
.toast b{display:block;font-size:19px;font-weight:900;letter-spacing:-.02em}
.toast span{display:block;font-size:11.5px;color:var(--ink-soft);font-weight:700;margin-top:4px}
.toast .tt{margin-top:12px}

.press:active{transform:scale(.985)}
.card,.bub,.icard{transition:transform .12s}

/* ============================================================
   V4 · SISTEMA DE CARDS — cada dominio, su propio diseño
   (cripto glass oscuro · fútbol scoreboard · tenis horizontal
    receta pills · fitness anillo · foco frosted · gaming dark
    compras ofertas · dormir nocturna) + iconografía propia
   ============================================================ */

/* ---------- badges de ícono (kawaii sólido) ---------- */
.ib{width:27px;height:27px;border-radius:9.5px;display:inline-flex;align-items:center;justify-content:center;
  flex:none;position:relative;box-shadow:0 2px 6px rgba(23,32,102,.15);
  color:#fff}

.ib.md{width:23px;height:23px;border-radius:8px}
.ib.md svg{width:13.5px;height:13.5px}
.ib.lg{width:34px;height:34px;border-radius:12px}
.ib.lg svg{width:20px;height:20px}
.ib.vio{background:linear-gradient(160deg,#8B6DFF,#5B41EE)}
.ib.gold{background:linear-gradient(160deg,#FFD75E,#F0A11C)}
.ib.blue{background:linear-gradient(160deg,#5FB0FF,#2E7CF6)}
.ib.green{background:linear-gradient(160deg,#4BDD8C,#22B35F)}
.ib.pink{background:linear-gradient(160deg,#FF9EBE,#F65E9B)}

/* base común */
.kcard{position:relative;width:340px;height:237px;margin:3px auto 9px;flex:none;border-radius:22px;
  background:#fff;overflow:hidden;box-shadow:0 16px 34px rgba(23,32,102,.28);transition:transform .12s}

.gpill{position:absolute;top:11px;left:11px;z-index:3;display:inline-flex;align-items:center;gap:6px;
  background:rgba(15,24,110,.82);color:#fff;border-radius:10px;padding:5px 11px 5px 9px;
  font-size:10.5px;font-weight:800;letter-spacing:.01em;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  box-shadow:0 4px 10px rgba(13,30,110,.4);max-width:calc(100% - 22px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gpill svg{width:13px;height:13px;flex:none}
.lchip{position:absolute;top:11px;right:11px;z-index:3;display:inline-flex;align-items:center;gap:5px;

.lchip::before{content:'';width:5px;height:5px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}

  linear-gradient(180deg,rgba(8,12,52,.66) 0%,rgba(8,12,52,.1) 30%,rgba(8,12,52,.06) 54%,rgba(8,12,52,.93) 70%),
  linear-gradient(76deg,rgba(8,12,52,.62) 0%,rgba(8,12,52,0) 52%)}

.cr-range .cur{position:absolute;top:-2.5px;left:62%;width:9px;height:9px;border-radius:50%;background:#7CFFB2;

.cr-range .lb{display:flex;justify-content:space-between;margin-top:5px;

.cr-spark{position:absolute;z-index:2;right:13px;bottom:44px;width:152px;height:46px;

.cr-coins{position:absolute;z-index:2;left:12px;right:12px;bottom:13px;display:flex;gap:6px}

.coin .u{color:#7CFFB2;font-weight:900}
.coin .d{color:#FFB4BC;font-weight:900}
.coin.on{background:rgba(255,255,255,.92);color:#1A237E;border-color:transparent;
  box-shadow:0 4px 12px rgba(4,8,40,.4)}

.fu-league .ib svg{width:11.5px;height:11.5px}
.fu-league{display:flex;align-items:center;gap:7px;font-size:9.5px;font-weight:900;color:#7982B4;

.fu-pos .pc .td.h{background:#1D3FA8}
.fu-pos .pc .td.a{background:#A50044}

.c-futbol .cta{margin-top:4px;border-radius:12px;padding:6.5px 8px 7.5px;font-size:11px}

/* ---------- 5 · FITNESS (art izq + anillo de progreso) ---------- */

.fi-lv i{width:4.5px;height:4.5px;border-radius:50%;background:#DCE2F3}
.fi-lv i.on{background:#2FC86E}
.fi-streak{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:900;
  color:#C25A00;background:#FEF0E4;border-radius:9px;padding:3.5px 8px}
.fi-streak svg{width:10.5px;height:10.5px;fill:#E6770F}

.fi-ring .rt b{font-size:16px;font-weight:900;color:var(--ink);line-height:1}
.fi-ring .rt span{font-size:8px;font-weight:800;color:#8A93C2;margin-top:1.5px}
.fi-list{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}

  background:var(--bg);color:#fff}
.fi-it .fdot svg{width:11.5px;height:11.5px}
.fi-it b{color:var(--ink);font-weight:900}
.fi-week{display:flex;align-items:flex-end;gap:4px;height:30px;padding:0 2px}
.fi-week .wb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;min-width:0}
.fi-week .bar{width:100%;max-width:16px;border-radius:3.5px;background:#E7ECF9;height:var(--h)}
.fi-week .wb.on .bar{background:linear-gradient(180deg,#8B6DFF,#5B41EE)}
.fi-week .lb{font-size:8px;font-weight:900;color:#8A93C2;text-transform:uppercase;line-height:1}
.fi-week .wb.on .lb{color:#6D52F8}
.fi-cta{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:6px;
  background:linear-gradient(180deg,#3BD67F,#23B363);color:#fff;border:none;border-radius:13px;
  font-family:inherit;font-size:11.5px;font-weight:900;padding:7.5px 6px 8.5px;
  box-shadow:0 6px 13px rgba(35,179,99,.34)}
.fi-cta svg{width:11px;height:11px}

/* ---------- 6 · TRABAJO (full-bleed + panel frosted) ---------- */
.c-focus{background:#0D1240}
.c-focus .bg{position:absolute;inset:0;background-image:var(--hero-trabajo);
  background-size:cover;background-position:center 40%}

  linear-gradient(180deg,rgba(10,16,60,.55) 0%,rgba(10,16,60,.05) 32%,rgba(10,16,60,.06) 52%,rgba(10,16,60,.68) 84%)}
.fo-glass{position:absolute;z-index:2;left:10px;right:10px;bottom:10px;
  background:rgba(13,20,80,.5);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.34);border-radius:17px;padding:10px 13px 11px;
  box-shadow:0 10px 26px rgba(6,10,44,.5)}
.fo-row{display:flex;align-items:center;gap:7px}
.fo-row .tt{font-size:11px;font-weight:900;color:#fff;letter-spacing:.04em;text-transform:uppercase;

.fo-prog{margin-top:8px;position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.3)}
.fo-prog i{position:absolute;left:0;top:0;bottom:0;width:50%;border-radius:3px;

.fo-prog b{position:absolute;top:-1.5px;left:calc(50% - 4.5px);width:9px;height:9px;border-radius:50%;background:#fff;

.fo-foot{display:flex;align-items:center;gap:7px;margin-top:10px}
.fo-task{flex:1;min-width:0;font-size:11px;font-weight:800;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 5px rgba(6,10,44,.65)}
.fo-btn{width:33px;height:33px;border-radius:50%;border:none;flex:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:#1A237E;
  background:linear-gradient(180deg,#fff,#DCE6FF);box-shadow:0 5px 12px rgba(6,10,44,.45)}
.fo-btn svg{width:13px;height:13px}
.fo-btn.skip{width:29px;height:29px;background:rgba(255,255,255,.26);color:#fff;
  box-shadow:none;border:1px solid rgba(255,255,255,.36)}
.fo-btn.skip svg{width:10.5px;height:10.5px}

/* ---------- 7 · GAMING (horizontal oscuro + arte) ---------- */
.c-game{display:flex;background:linear-gradient(150deg,#232B63 0%,#141949 62%,#0D1240 100%)}

.ga-lbl{display:flex;align-items:center;gap:7px;font-size:9.5px;font-weight:900;color:#C9D2F6;
  text-transform:uppercase;letter-spacing:.07em}

.ga-lbl .ib svg{width:11.5px;height:11.5px}
.ga-trow>div:first-child{flex:1;min-width:0}
.ga-trow{display:flex;align-items:center;gap:10px}
.ga-title{margin:0;font-size:15.5px;font-weight:900;letter-spacing:-.015em;line-height:1.12}
.ga-sub{font-size:10.5px;font-weight:700;color:#C9D2F6;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  align-items:center;justify-content:center;color:#fff;box-shadow:0 5px 12px rgba(34,179,95,.45)}

.ga-stars{display:flex;align-items:center;gap:2.5px}
.ga-stars svg{width:12px;height:12px;color:#FFD75E}
.ga-stars svg.dim{color:#4A5590}
.ga-meta{font-size:9.5px;font-weight:800;color:#B9C3F0}
.ga-stars b{font-size:11.5px;font-weight:900;color:#fff;margin-left:4px}
.ga-chips{display:flex;gap:4.5px}
.ga-chip{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.24);border-radius:8px;
  padding:3.5px 8px;font-size:9.5px;font-weight:800;color:#E8ECFF}
.ga-cta{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:6px;
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.32);color:#fff;border-radius:12.5px;
  font-family:inherit;font-size:11.5px;font-weight:900;padding:7px 6px 8px;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ga-cta svg{width:11px;height:11px}
.ga-art{width:116px;flex:none;position:relative;background-image:var(--hero-game-s);
  background-size:100% auto;background-position:center 42%;background-repeat:no-repeat;
  -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 16%,#000 84%,transparent 100%);
  mask-image:linear-gradient(180deg,transparent 0%,#000 16%,#000 84%,transparent 100%)}
.ga-art::after{content:'';position:absolute;inset:0;background:linear-gradient(270deg,rgba(13,18,64,0) 55%,rgba(13,18,64,.55))}

.sh-thumb{width:26px;height:26px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:900;color:#fff;box-shadow:0 2px 6px rgba(23,32,102,.15)}
.sh-nm{flex:1;min-width:0}

.c-shop .cta{margin-top:auto;border-radius:13px;padding:6px 8px 7.5px;font-size:11px}

.sl-fases .fb{display:flex;height:10px;border-radius:5px;overflow:hidden;background:rgba(255,255,255,.15)}

  padding:6px 8px 6.5px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sl-stat b{display:block;font-size:11.5px;font-weight:900;color:#fff}
.sl-stat span{display:block;font-size:8.5px;font-weight:800;color:#D6DEF9;margin-top:.5px}
.sl-cta{margin-top:auto;margin-right:-72px;display:flex;align-items:center;justify-content:center;gap:6px;
  background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.36);color:#fff;border-radius:12.5px;
  font-family:inherit;font-size:11px;font-weight:900;padding:7px 6px 8px}
.sl-cta svg{width:11.5px;height:11.5px}
.sl-moon{position:absolute;top:14px;right:15px;z-index:2;width:30px;height:30px;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#FFF6D8,#FFE9A8 52%,#F5D879);
  box-shadow:0 0 20px 3px rgba(255,224,130,.4);display:flex;align-items:center;justify-content:center}
.sl-moon svg{width:17px;height:17px;color:#8C6A1D}

<script>
(function(){
  // ----- demo 1: radar hora a hora (phone 1) -----
  var radar = document.getElementById('radar1');
  var radarBtn = document.getElementById('radarBtn');
  var radarTxt = document.getElementById('radarBtnTxt');
  if (radarBtn && radar){
    radarBtn.addEventListener('click', function(){
      var open = radar.classList.toggle('open');
      radarTxt.textContent = open ? 'Cerrar radar' : 'Ver el radar hora por hora';
    });
  }

  // ----- demo 2: pills rápidas (ambos phones) -----
  Array.prototype.forEach.call(document.querySelectorAll('.qpills'), function(row){
    row.addEventListener('click', function(e){
      var b = e.target.closest('.qpill'); if (!b) return;
      Array.prototype.forEach.call(row.querySelectorAll('.qpill'), function(x){ x.classList.remove('on'); });
      b.classList.add('on');
    });
  });

  // ----- demo 3: chips de monedas (card cripto) -----
  var coins = document.getElementById('coins');
  if (coins){
    coins.addEventListener('click', function(e){
      var c = e.target.closest('.coin'); if (!c) return;
      Array.prototype.forEach.call(coins.querySelectorAll('.coin'), function(x){ x.classList.remove('on'); });
      c.classList.add('on');
    });
  }

  // ----- demo 3b: pausa/play del bloque de foco (card trabajo) -----
  var foBtn = document.getElementById('foBtn');
  var foTime = document.getElementById('foTime');
  var foState = document.getElementById('foState');
  if (foBtn){
    var paused = false;
    foBtn.addEventListener('click', function(){
      paused = !paused;
      foBtn.innerHTML = paused
        ? '<svg viewBox="0 0 24 24" fill="currentColor"><use href="#k-play"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="currentColor"><use href="#k-pause"/></svg>';
      foTime.textContent = '50:00';
      foState.textContent = paused ? 'en pausa · respirá un poco' : 'mientras suena tu playlist';
    });
  }

  // ----- demo 4: checklist misión → XP → banner → toast (phone 2) -----
  var XP_START = 320, XP_MAX = 500;
  var list = document.getElementById('mList');
  var fill = document.getElementById('xpFill1');
  var txt  = document.getElementById('xpTxt1');
  var cnt  = document.getElementById('mCount');
  var banB = document.getElementById('mBannerB');
  var banS = document.getElementById('mBannerS');
  var toast = document.getElementById('toast1');

  function items(){ return list ? list.querySelectorAll('li') : []; }
  function done(){ return Array.prototype.filter.call(items(), function(li){return li.classList.contains('done')}); }
  function render(){
    var d = done().length, n = items().length, xp = XP_START + 20*d;
    cnt.textContent = d + '/' + n;
    fill.style.width = Math.min(100, Math.round(xp/XP_MAX*100)) + '%';
    txt.textContent  = xp + ' / ' + XP_MAX + ' XP';
    if (d === 0){ banB.textContent = '¡Empieza tu primera misión!'; banS.textContent = 'Vas perfecto, campeón'; }
    else if (d < n){ banB.textContent = '¡Ya llevas ' + d + ' completada' + (d>1?'s':'') + '!'; banS.textContent = 'Vas perfecto, campeón'; }
    else { banB.textContent = '¡Misión del día completada!'; banS.textContent = 'Eres imparable, campeón'; }
  }
  function showToast(){
    toast.classList.add('show');
    setTimeout(function(){ toast.classList.remove('show'); }, 3000);
  }
  if (list){
    list.addEventListener('click', function(e){
      var li = e.target.closest('li'); if (!li) return;
      var wasDone = li.classList.contains('done');
      li.classList.toggle('done');
      if (!wasDone && done().length === items().length) showToast();
      render();
    });
  }
  var rb = document.getElementById('resetBtn');
  if (rb) rb.addEventListener('click', function(){
    Array.prototype.forEach.call(items(), function(li, i){
      li.classList.toggle('done', i === 0); // estado inicial de la referencia: 1/3
    });
    toast.classList.remove('show');
    render();
  });
  render();
})();
</script>
